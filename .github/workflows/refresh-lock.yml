name: Refresh lockfile

on:
  push:
    branches:
      - agent/final-publication-standard

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts=false

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is current"
          else
            git commit -m "chore: refresh package lock for v2.0.1"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
