name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - docs/RELEASE_NOTES_v*.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES_FILE="docs/RELEASE_NOTES_${TAG}.md"

          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "Missing release notes: ${NOTES_FILE}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create or synchronize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "AI Data Prep Converter ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "AI Data Prep Converter ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          fi
