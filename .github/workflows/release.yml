name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - docs/RELEASE_NOTES_v2.0.0.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v2.0.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists"
            exit 0
          fi

          gh release create v2.0.0 \
            --target "${GITHUB_SHA}" \
            --title "AI Data Prep Converter v2.0.0" \
            --notes-file docs/RELEASE_NOTES_v2.0.0.md
