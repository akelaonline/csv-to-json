name: Generate lockfile

on:
  push:
    branches:
      - agent/repo-branding-release
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts=false
      - name: Commit lockfile to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore: add reproducible package lock"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
